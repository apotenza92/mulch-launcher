<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MulchLauncher</title>
  <meta name="description" content="Every installed game, from every launcher, in one place. Zero setup.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #f4f4f8; --fg: #16161c; --muted: #5b5b6b;
      --from: #3f7bff; --to: #9a5cf5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0d12; --fg: #f2f2f7; --muted: #a0a0b2; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(60rem 40rem at 50% -10%, color-mix(in srgb, var(--to) 22%, transparent), transparent), var(--bg);
      color: var(--fg); font: 16px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    main { max-width: 34rem; }
    img { width: 128px; height: 128px; filter: drop-shadow(0 18px 30px rgba(80, 60, 200, .35)); }
    h1 { margin: 20px 0 6px; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -.02em; }
    p { margin: 0 0 32px; color: var(--muted); font-size: 1.15rem; }
    a.download {
      display: inline-block; padding: 16px 36px; border-radius: 999px; color: #fff; text-decoration: none;
      font-weight: 600; font-size: 1.1rem; background: linear-gradient(120deg, var(--from), var(--to));
      box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--to) 70%, transparent);
      transition: transform .35s cubic-bezier(.2, 1.4, .4, 1), box-shadow .35s;
    }
    a.download:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 16px 36px -8px color-mix(in srgb, var(--to) 80%, transparent); }
    a.download:focus-visible { outline: 3px solid var(--from); outline-offset: 4px; }
    small { display: block; margin-top: 16px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="">
    <h1>MulchLauncher</h1>
    <p>Every game you have installed, from every launcher, in one place. Nothing to set up.</p>
    <a class="download" href="https://github.com/apotenza92/mulch-launcher/releases/latest/download/MulchLauncher.exe">Download for Windows</a>
    <small>Windows 10 and 11 · Free</small>
  </main>
</body>
</html>
