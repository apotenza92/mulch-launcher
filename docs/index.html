<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MulchLauncher</title>
  <meta name="description" content="A game launcher that automatically finds all your games, from every launcher.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #fff6ea; --fg: #2a1a10; --muted: #7a5a44;
      --from: #f7a531; --to: #e8613c; --glow: #ffb66b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17100b; --fg: #fbeedd; --muted: #c8a688; --glow: #c8642c; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(60rem 40rem at 50% -10%, color-mix(in srgb, var(--glow) 35%, transparent), transparent), var(--bg);
      color: var(--fg); font: 16px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    main { max-width: 34rem; }
    img { width: 128px; height: 128px; filter: drop-shadow(0 18px 30px rgba(200, 100, 40, .35)); }
    h1 { margin: 20px 0 28px; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -.02em; }
    p { margin: 0 0 32px; color: var(--muted); font-size: 1.15rem; }
    a.download {
      display: inline-block; padding: 16px 36px; border-radius: 999px; color: #fff; text-decoration: none;
      font-weight: 600; font-size: 1.1rem; background: linear-gradient(120deg, var(--from), var(--to));
      box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--to) 70%, transparent);
      transition: transform .35s cubic-bezier(.2, 1.4, .4, 1), box-shadow .35s;
    }
    a.download:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 16px 36px -8px color-mix(in srgb, var(--to) 80%, transparent); }
    a.download:focus-visible { outline: 3px solid var(--from); outline-offset: 4px; }
    a.source { display: inline-block; margin-top: 28px; color: var(--muted); opacity: .7; transition: opacity .2s, color .2s; }
    a.source:hover, a.source:focus-visible { opacity: 1; color: var(--fg); }
    a.source svg { width: 22px; height: 22px; display: block; }
    small { display: block; margin-top: 16px; color: var(--muted); }
  </style>
</head>

  <main>
    <img src="logo.png" alt="">
    <h1>MulchLauncher</h1>
