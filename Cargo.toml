[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
mulch-core = { path = "crates/core" }
mulch-art = { path = "crates/art" }
mulch-posters = { path = "crates/posters" }
mulch-history = { path = "crates/history" }
mulch-steam = { path = "crates/steam" }
mulch-epic = { path = "crates/epic" }
mulch-ubisoft = { path = "crates/ubisoft" }
mulch-gog = { path = "crates/gog" }
mulch-xbox = { path = "crates/xbox" }
mulch-battlenet = { path = "crates/battlenet" }
mulch-rockstar = { path = "crates/rockstar" }
mulch-ea = { path = "crates/ea" }
mulch-manual = { path = "crates/manual" }
mulch-social = { path = "crates/social" }
mulch-discover = { path = "crates/discover" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
ureq = { version = "2", features = ["json"] }
winreg = "0.55"
windows = "0.61"

# The app: window, setup/install, settings and grid sizing. Everything about
# finding games lives in the crates/ libraries.
[package]
name = "mulch-launcher"
version = "0.1.0"
edition = "2024"
description = "The low-maintenance game launcher: every installed game, from every platform, with zero setup."
license = "MIT"
publish = false

[lib]
name = "mulch_launcher"
path = "src/lib.rs"

[[bin]]
name = "MulchLauncher"
path = "src/main.rs"
# Tests live in the library; the window code is too heavy to build in test mode.
test = false

[dependencies]
gpui-kit = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
winreg = { workspace = true }
windows = { workspace = true, features = [
    "Foundation", "UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
mulch-core = { workspace = true }
mulch-art = { workspace = true }
mulch-posters = { workspace = true }
mulch-history = { workspace = true }
mulch-steam = { workspace = true }
mulch-epic = { workspace = true }
mulch-ubisoft = { workspace = true }
mulch-gog = { workspace = true }
mulch-xbox = { workspace = true }
mulch-battlenet = { workspace = true }
mulch-rockstar = { workspace = true }
mulch-ea = { workspace = true }
mulch-manual = { workspace = true }
mulch-social = { workspace = true }
mulch-discover = { workspace = true }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
