[package]
name = "mulch-launcher"
version = "0.1.0"
edition = "2024"
description = "The low-maintenance game launcher: every installed game, from every platform, with zero setup."
license = "MIT"
publish = false

[lib]
name = "mulch_launcher"
path = "src/lib.rs"

[[bin]]
name = "MulchLauncher"
path = "src/main.rs"
# Tests live in the library; the window code is too heavy to build in test mode.
test = false

[dependencies]
gpui-kit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "ApplicationModel",
    "ApplicationModel_Core",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Storage",
    "UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
