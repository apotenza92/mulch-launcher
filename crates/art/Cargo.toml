[package]
name = "mulch-art"
version = "0.1.0"
description = "Icons for MulchLauncher, from executables and package logos"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
mulch-core = { workspace = true }
png = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "bmp"] }
