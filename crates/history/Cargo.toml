[package]
name = "mulch-history"
version = "0.1.0"
description = "MulchLauncher's own last-played tracking"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
mulch-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }